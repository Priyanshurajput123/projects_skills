<!DOCTYPE html>
<html lang="en">
<head>
<title>House Price Prediction</title>
<style>
    body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    }
    .container {
    background: white;
    padding: 20px 30px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    width: 400px;
    }
    h2 {
    text-align: center;
    margin-bottom: 20px;
    }
    label {
    display: block;
    margin: 10px 0 5px;
    }
    input, select {
    width: 100%;
    padding: 8px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    }
    button {
    width: 100%;
    padding: 10px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    }
    button:hover {
    background: #0056b3;
    }
    .result {
    margin-top: 20px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: green;
    }
</style>
</head>
<body>
<div class="container">
    <h2>🏠 House Price Prediction</h2>
    <form id="predictionForm">
    <label for="area">Area (sq ft):</label>
    <input type="number" id="area" name="area" required>

    <label for="bedrooms">Bedrooms:</label>
    <input type="number" id="bedrooms" name="bedrooms" required>

    <label for="bathrooms">Bathrooms:</label>
    <input type="number" id="bathrooms" name="bathrooms" required>

    <label for="location">Location:</label>
    <select id="location" name="location" required>
        <option value="">--Select--</option>
        <option value="city_center">City Center</option>
        <option value="suburb">Suburb</option>
        <option value="rural">Rural Area</option>
    </select>

    <button type="submit">Predict Price</button>
    </form>

    <div class="result" id="result"></div>
</div>

<script>
    document.getElementById("predictionForm").addEventListener("submit", function(event) {
    event.preventDefault();

      // Sample dummy calculation (replace with ML backend/API call)
    let area = parseFloat(document.getElementById("area").value);
    let bedrooms = parseInt(document.getElementById("bedrooms").value);
    let bathrooms = parseInt(document.getElementById("bathrooms").value);
    let location = document.getElementById("location").value;

      let basePrice = area * 1000;
      basePrice += bedrooms * 50000;
      basePrice += bathrooms * 30000;

      if(location === "city_center") basePrice *= 1.5;
      else if(location === "suburb") basePrice *= 1.2;
      else basePrice *= 0.9;

    document.getElementById("result").innerText = "Predicted Price: ₹ " + basePrice.toLocaleString();
    });
</script>
</body>
</html>
